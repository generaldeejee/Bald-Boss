name: Build PSP EBOOT
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tools/generate_voice.py"
      - "tools/generate_psp_music.py"
      - "tools/music_sources/**"
      - "assets/**"
      - "Makefile"
      - ".github/workflows/build-psp.yml"

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free audio-generation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak ffmpeg libsndfile1
          python3 -m pip install --user numpy scipy soundfile piper-tts==1.3.0 praat-parselmouth==0.4.7
      - name: Cache offline neural voice model
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-en-us-john-medium-789c6c875726
      - name: Test singing pitch and voice ducking
        run: python3 tools/test_melodic_voice.py
      - name: Generate announcer and melodic rock soundtrack
        run: |
          python3 tools/generate_voice.py
          python3 tools/generate_psp_music.py
          test -s src/voice_sample.h
          test -s src/music_samples.h
      - name: Upload game audio
        uses: actions/upload-artifact@v4
        with:
          name: BaldBoss-PSP-Audio
          path: |
            src/voice_sample.h
            src/music_samples.h
          if-no-files-found: error

  psp-build:
    needs: generate-audio
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BaldBoss-PSP-Audio
          path: src
      - name: Compile native PSP EBOOT
        run: make -j2
      - name: Verify EBOOT
        run: test -s EBOOT.PBP
      - uses: actions/upload-artifact@v4
        with:
          name: BaldBoss3D-PSP-EBOOT
          path: |
            EBOOT.PBP
            assets/ICON0.PNG
          if-no-files-found: error
