name: Build PSP EBOOT
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tools/generate_voice.py"
      - "tools/generate_psp_music.py"
      - "tools/music_sources/**"
      - "assets/**"
      - "Makefile"
      - ".github/workflows/build-psp.yml"

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install free audio-generation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak ffmpeg libsndfile1
          python3 -m pip install --user numpy scipy soundfile piper-tts==1.3.0
      - name: Cache offline neural announcer model
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-en-us-john-medium-789c6c875726
      - name: Generate neural announcer and Deep Voice music
        run: |
          python3 tools/generate_voice.py
          python3 tools/generate_psp_music.py
          test -s src/voice_sample.h
          test -s src/music_samples.h
          grep -q '^#define VOICE_SAMPLE_RATE 22050$' src/voice_sample.h
          grep -q '^#define BALD_BOSS_VOICE_ENGINE_PIPER 1
      - uses: actions/upload-artifact@v4
        with:
          name: BaldBoss-PSP-Audio
          path: |
            src/voice_sample.h
            src/music_samples.h
          if-no-files-found: error
  psp-build:
    needs: generate-audio
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BaldBoss-PSP-Audio
          path: src
      - name: Build with PSPSDK
        run: make -j2
      - name: Check produced EBOOT
        run: |
          test -s EBOOT.PBP
          file EBOOT.PBP || true
      - uses: actions/upload-artifact@v4
        with:
          name: BaldBoss3D-PSP-EBOOT
          path: |
            EBOOT.PBP
            assets/ICON0.PNG
          if-no-files-found: error
 src/voice_sample.h
          grep -q '^#define BALD_BOSS_MUSIC_VOCALS_PIPER 1
      - uses: actions/upload-artifact@v4
        with:
          name: BaldBoss-PSP-Audio
          path: |
            src/voice_sample.h
            src/music_samples.h
          if-no-files-found: error
  psp-build:
    needs: generate-audio
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BaldBoss-PSP-Audio
          path: src
      - name: Build with PSPSDK
        run: make -j2
      - name: Check produced EBOOT
        run: |
          test -s EBOOT.PBP
          file EBOOT.PBP || true
      - uses: actions/upload-artifact@v4
        with:
          name: BaldBoss3D-PSP-EBOOT
          path: |
            EBOOT.PBP
            assets/ICON0.PNG
          if-no-files-found: error
 src/music_samples.h
          echo "Piper neural announcer and expressive menu-song vocals generated"
      - uses: actions/upload-artifact@v4
        with:
          name: BaldBoss-PSP-Audio
          path: |
            src/voice_sample.h
            src/music_samples.h
          if-no-files-found: error
  psp-build:
    needs: generate-audio
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BaldBoss-PSP-Audio
          path: src
      - name: Build with PSPSDK
        run: make -j2
      - name: Check produced EBOOT
        run: |
          test -s EBOOT.PBP
          file EBOOT.PBP || true
      - uses: actions/upload-artifact@v4
        with:
          name: BaldBoss3D-PSP-EBOOT
          path: |
            EBOOT.PBP
            assets/ICON0.PNG
          if-no-files-found: error
