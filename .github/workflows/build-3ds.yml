name: Build Bald Elite Nintendo 3DS

on:
  workflow_dispatch:
  push:
    paths:
      - "3ds/**"
      - ".github/workflows/build-3ds.yml"

jobs:
  mesh-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable 3DS head and hairstyles with host GCC
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror \
            3ds/tests/test_mesh.c 3ds/source/mesh.c -lm -o /tmp/bald-elite-3ds-mesh-test
          /tmp/bald-elite-3ds-mesh-test
      - name: Compile and test full 3DS arcade game rules on host
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror \
            3ds/tests/test_game.c 3ds/source/game.c 3ds/source/mesh.c \
            -lm -o /tmp/bald-elite-3ds-arcade-test
          /tmp/bald-elite-3ds-arcade-test

  build-3ds:
    needs: mesh-test
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Nintendo 3DS cross-toolchain
        run: |
          set -eux
          test -n "${DEVKITARM}"
          test -n "${DEVKITPRO}"
          test -f "${DEVKITARM}/3ds_rules"
          arm-none-eabi-gcc --version
          command -v picasso
          command -v 3dsxtool
          command -v smdhtool
          test -f "${DEVKITPRO}/libctru/include/3ds.h"
          test -f "${DEVKITPRO}/libctru/include/citro3d.h"
      - name: Assemble PICA200 vertex shader (fail early on syntax)
        run: |
          set -eux
          picasso -o /tmp/bald_elite_shader.shbin 3ds/source/vshader.v.pica
          test -s /tmp/bald_elite_shader.shbin
      - name: Build native Bald Elite 3DS homebrew
        run: |
          set -eux
          make -C 3ds clean
          make -C 3ds -j2
          ls -lh 3ds/*.3dsx 3ds/*.smdh
      - name: Check 3DS Homebrew Launcher executable
        run: test -s 3ds/bald_elite_3ds.3dsx
      - uses: actions/upload-artifact@v4
        with:
          name: BaldElite-3DS-Playable
          path: |
            3ds/bald_elite_3ds.3dsx
            3ds/bald_elite_3ds.smdh
          if-no-files-found: error
