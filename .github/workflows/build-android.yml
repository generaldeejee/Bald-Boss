name: Build Bald Elite Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Use JDK 17 for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK on Ubuntu runner
        run: |
          set -eux
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Retrieve original PSP music and announcer
        uses: actions/download-artifact@v4
        with:
          name: BaldElite-PSP-Assets
          repository: generaldeejee/Bald-Boss
          run-id: 39478827781
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .psp-assets
      - name: Create Bald Elite launcher icon and preserve PSP audio
        run: |
          python3 -m pip install --user --quiet Pillow
          python3 android/tools/prepare_assets.py \
            --music-header .psp-assets/src/music_samples.h \
            --voice-header .psp-assets/src/voice_sample.h
          test -s android/app/src/main/assets/psp_title_vocals.pcm
          test -s android/app/src/main/assets/psp_game_instrumental.pcm
          test -s android/app/src/main/assets/psp_victory_voice.pcm
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Render original Bald Elite stereo 44.1 kHz score
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak libsndfile1
          python3 -m pip install --quiet --user numpy scipy soundfile pillow piper-tts==1.3.0 praat-parselmouth==0.4.7
          python3 tools/music_sources/make_bald_boss_deep_voice.py
          mkdir -p android/app/src/main/assets
          ffmpeg -y -loglevel error -i tools/music_sources/Bald_Boss_80s_Deep_Voice.wav \
            -c:a libvorbis -q:a 7 android/app/src/main/assets/psp_title_hq.ogg
          ffmpeg -y -loglevel error -i tools/music_sources/Bald_Boss_80s_Deep_Instrumental.wav \
            -c:a libvorbis -q:a 7 android/app/src/main/assets/psp_game_hq.ogg
          ffprobe -v error -show_entries stream=sample_rate,channels -of default=nw=1 \
            android/app/src/main/assets/psp_title_hq.ogg
          test -s android/app/src/main/assets/psp_game_hq.ogg
      - name: Prepare Deluxe club intro, menu and victory artwork
        run: |
          python3 android/tools/make_deluxe_art.py
          test -s android/app/src/main/assets/club_intro.jpg
          test -s android/app/src/main/assets/club_menu.jpg
          test -s android/app/src/main/assets/club_victory.jpg
          test -s android/app/src/main/assets/club_crest.png
      - name: Generate photographic-style 2K skin and packed detail textures
        run: |
          python3 android/tools/make_face_textures.py
          python3 android/tools/make_profile_scalp.py
          for i in 0 1 2; do
            test -s "android/app/src/main/assets/skin_${i}.jpg"
            test -s "android/app/src/main/assets/scalp_${i}.jpg"
            test -s "android/app/src/main/assets/ear_${i}.jpg"
          done
          test -s android/app/src/main/assets/skin_detail.jpg
      - name: Compile native Android application
        run: gradle -p android --no-daemon --stacktrace :app:assembleDebug
      - name: Verify installable APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | tail -1
      - name: Upload sample skin textures for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: BaldElite-2.2-Skin-Atlases
          path: |
            android/app/src/main/assets/skin_0.jpg
            android/app/src/main/assets/scalp_0.jpg
            android/app/src/main/assets/ear_0.jpg
            android/app/src/main/assets/skin_detail.jpg
          if-no-files-found: error
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BaldElite-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

